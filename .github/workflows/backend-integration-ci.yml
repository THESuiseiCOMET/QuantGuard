name: QuantGuard Backend Integration CI

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "quant-guard-backend/**"
      - ".github/workflows/backend-integration-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "quant-guard-backend/**"
      - ".github/workflows/backend-integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: quant-guard-backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: quant-guard-backend
        run: chmod +x mvnw

      - name: Verify Docker is available
        run: docker info

      - name: Run backend integration tests
        working-directory: quant-guard-backend
        run: ./mvnw --batch-mode -P integration verify

      - name: Verify integration tests were not skipped
        shell: bash
        working-directory: quant-guard-backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          reports = list(Path("target/failsafe-reports").glob("*.xml"))
          if not reports:
              print("No Failsafe XML reports found.")
              sys.exit(1)

          total_tests = 0
          total_skipped = 0
          migration_suite = None
          for report in reports:
              root = ET.parse(report).getroot()
              total_tests += int(root.attrib.get("tests", "0"))
              total_skipped += int(root.attrib.get("skipped", "0"))
              if root.attrib.get("name", "").endswith(".MarketDataSchemaMigrationIT"):
                  migration_suite = root

          print(f"Integration tests run: {total_tests}")
          print(f"Integration tests skipped: {total_skipped}")

          if total_tests < 9:
              print("Expected at least 9 integration tests.")
              sys.exit(1)
          if total_skipped != 0:
              print("Integration tests must not be skipped in GitHub Actions.")
              sys.exit(1)

          if migration_suite is None:
              print("MarketDataSchemaMigrationIT report was not produced.")
              sys.exit(1)

          migration_tests = int(migration_suite.attrib.get("tests", "0"))
          migration_skipped = int(migration_suite.attrib.get("skipped", "0"))
          migration_failures = int(migration_suite.attrib.get("failures", "0"))
          migration_errors = int(migration_suite.attrib.get("errors", "0"))
          print(f"MarketDataSchemaMigrationIT tests run: {migration_tests}")
          print(f"MarketDataSchemaMigrationIT tests skipped: {migration_skipped}")

          if (migration_tests, migration_skipped, migration_failures, migration_errors) != (3, 0, 0, 0):
              print("Expected all 3 V7/V8 migration tests to execute and pass.")
              sys.exit(1)
          PY

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            quant-guard-backend/target/surefire-reports/**
            quant-guard-backend/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7
