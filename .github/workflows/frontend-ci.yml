name: QuantGuard Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: quant-guard-frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: quant-guard-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type check
        run: npm run type-check

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
