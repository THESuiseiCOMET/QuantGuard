name: QuantGuard Windows Desktop CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "refactor/**"
      - "feature/**"
    paths:
      - "quant-guard-frontend/**"
      - "quant-guard-market-data-python/**"
      - "quant-guard-backend/**"
      - "scripts/build-*-runtime.ps1"
      - "scripts/build-desktop-runtimes.ps1"
      - "scripts/build-tauri-desktop.ps1"
      - "scripts/build-windows-release.ps1"
      - "scripts/stage-tauri-runtimes.ps1"
      - "scripts/test-desktop-runtimes.ps1"
      - "scripts/test-tauri-lifecycle.ps1"
      - "scripts/runtime-build-common.ps1"
      - ".gitattributes"
      - ".github/workflows/windows-desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "quant-guard-frontend/**"
      - "quant-guard-market-data-python/**"
      - "quant-guard-backend/**"
      - "scripts/**"
      - ".gitattributes"
      - ".github/workflows/windows-desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/heads/refactor/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify rotating logs without building installers
        shell: pwsh
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"resources":null}}'
        run: |
          rustc -V
          rustc --edition=2024 --test quant-guard-frontend/src-tauri/src/rotating_log.rs -o "$env:RUNNER_TEMP/quantguard-log-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/quantguard-log-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path quant-guard-frontend/src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --manifest-path quant-guard-frontend/src-tauri/Cargo.toml --all-targets

  build:
    # Refactor branches run source checks; packaging is deferred by user request.
    if: ${{ !startsWith(github.ref, 'refs/heads/refactor/') }}
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: quant-guard-frontend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            quant-guard-market-data-python/requirements.txt
            quant-guard-market-data-python/requirements-test.txt
            quant-guard-market-data-python/requirements-build.txt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: quant-guard-backend/pom.xml

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V
          cargo -V

      - name: Prepare Python virtual environment
        shell: pwsh
        run: |
          python -m venv quant-guard-market-data-python/.venv

      - name: Build and verify Windows release candidate
        shell: pwsh
        run: ./scripts/build-windows-release.ps1 -SkipDefenderScan

      - name: Resolve artifact name
        id: artifact
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "name=quantguard-windows-v1.2.0-$shortSha" >> $env:GITHUB_OUTPUT

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/windows-release/QuantGuard_1.2.0_x64-setup.exe
            dist/windows-release/QuantGuard_1.2.0_x64-setup.exe.sha256
            dist/windows-release/release-build-summary.md
          if-no-files-found: error
          retention-days: 14
