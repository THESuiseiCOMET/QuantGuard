name: QuantGuard Windows Runtime CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "refactor/**"
      - "feature/**"
    paths:
      - "quant-guard-market-data-python/**"
      - "quant-guard-backend/**"
      - "scripts/build-*-runtime.ps1"
      - "scripts/build-desktop-runtimes.ps1"
      - "scripts/test-desktop-runtimes.ps1"
      - "scripts/runtime-build-common.ps1"
      - ".github/workflows/windows-runtime-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "quant-guard-market-data-python/**"
      - "quant-guard-backend/**"
      - "scripts/build-*-runtime.ps1"
      - "scripts/build-desktop-runtimes.ps1"
      - "scripts/test-desktop-runtimes.ps1"
      - "scripts/runtime-build-common.ps1"
      - ".github/workflows/windows-runtime-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Refactor branches run source checks; packaging is deferred by user request.
    if: ${{ !startsWith(github.ref, 'refs/heads/refactor/') }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            quant-guard-market-data-python/requirements.txt
            quant-guard-market-data-python/requirements-build.txt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: quant-guard-backend/pom.xml

      - name: Prepare Python build environment
        shell: pwsh
        run: |
          python -m venv quant-guard-market-data-python/.venv
          & quant-guard-market-data-python/.venv/Scripts/python.exe -m pip install --upgrade pip
          & quant-guard-market-data-python/.venv/Scripts/python.exe -m pip install `
            -r quant-guard-market-data-python/requirements.txt `
            -r quant-guard-market-data-python/requirements-build.txt

      - name: Build and test self-contained runtimes
        shell: pwsh
        run: ./scripts/build-desktop-runtimes.ps1

      - name: Upload Windows runtime directories
        uses: actions/upload-artifact@v4
        with:
          name: quantguard-desktop-runtimes-windows-x64
          path: |
            dist/desktop-runtime/market-data/**
            dist/desktop-runtime/backend/**
          if-no-files-found: error
          retention-days: 7
