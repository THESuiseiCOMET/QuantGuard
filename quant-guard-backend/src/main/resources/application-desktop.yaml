spring:
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: QuantGuardDesktopPool
      minimum-idle: 1
      maximum-pool-size: 4
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/desktop-migration
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never

logging:
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
      total-size-cap: 50MB

quantguard:
  market-data:
    auto-sync-enabled: ${MARKET_DATA_AUTO_SYNC_ENABLED:false}
