spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/quant_guard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: your_mysql_password

quantguard:
  market-data:
    provider: ${MARKET_DATA_PROVIDER:python}
    token: ${TUSHARE_TOKEN:}
    python:
      base-url: ${PYTHON_MARKET_DATA_BASE_URL:http://127.0.0.1:8001}
    auto-sync-enabled: ${MARKET_DATA_AUTO_SYNC_ENABLED:false}
